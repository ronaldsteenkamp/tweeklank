# Configuratie voor de Supabase CLI (lokaal ontwikkelen, migraties, functies).
project_id = "tweeklank"

[auth]
site_url = "tweeklank://"

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 3600

[functions.delete-account]
verify_jwt = true

[functions.send-push]
# Beveiligd met de header x-tweeklank-secret in plaats van een gebruikers-JWT
verify_jwt = false
